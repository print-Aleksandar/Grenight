<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grenight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="main">
    <div>
        <div id="logo" style="display: flex; justify-content: center; align-items: center; margin: 15px 0;">
            <img src="logo/logo_transparent.png" style="max-width: 125px; display: block"></div>
        <div id="buttons" style="display: flex; justify-content: space-between; align-items: center; height: 50px;">
            <button id="restart_pvp" style="display: block">Restart PvP</button>
            <button id="restart_pve" style="display: block">Restart PvE</button>
        </div>
        <div id="board_container">
            <div id="board_wrapper">
                <div id="board"></div>
            </div>
            <div id="promotion_modal_wrapper">
                <div id="promotion_modal">
                    <div data-figure="knight" class="promotion_square black"></div>
                    <div data-figure="bishop" class="promotion_square white"></div>
                    <div data-figure="rook" class="promotion_square black"></div>
                    <div data-figure="queen" class="promotion_square white"></div>
                </div>
            </div>
        </div>
        <h1 style="text-align: center;"><span id="status" style="color: darkred;"></span></h1>
    </div>
</div>



<script src="app.js"></script>
</body>
</html>
